name: Pipeline Games (Update & Notify)

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    name: 💰 Atualizar Preços
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-jobs.txt ]; then pip install -r requirements-jobs.txt; fi
          pip install httpx sqlalchemy asyncpg python-dotenv pydantic-settings greenlet

      - name: Rodar Script de Preços
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANY_DEAL_BASE_URL: ${{ secrets.ANY_DEAL_BASE_URL }}
          ANY_DEAL_API_KEY: ${{ secrets.ANY_DEAL_API_KEY }}
          
          # fake env
          SECRET_KEY: "key_apenas_para_o_script_rodar"
          REFRESH_SECRET_KEY: "refresh_key"
          BACKOFFICE_TOKEN: "dtoken"
          RAWG_API_KEY: "rawg"
          RAWG_BASE_URL: "http://google.com" 
          REDIS_URL: "redis://dummy:6379/0"
          PYTHONPATH: . 
        run: |
          python -m scripts.run_update

  notify-users:
    runs-on: ubuntu-latest

    needs: update-prices
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar Script de Notificação
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        run: |
          python -m scripts.run_notifications
